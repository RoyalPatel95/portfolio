apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: prod

spec:
  replicas: 2
  selector:
    matchLabel:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio

    spec:
      - name: portfolio
        image: royalpatel95/portfolio:latest
        ports:
          - containerPort: 80
